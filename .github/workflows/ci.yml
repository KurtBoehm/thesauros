name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  #-------------------------------------------------------------------------------------------------
  # Meson, the primary build system: the full platform matrix
  #-------------------------------------------------------------------------------------------------
  meson:
    name: Meson · ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux, x86-64. GCC 14 and Clang 21 are the documented minimum versions, so both are
          # tested to keep newer-than-supported constructs from creeping in.
          - name: Linux x86-64 (GCC 14)
            runner: ubuntu-26.04
            shell: bash
            cc: gcc-14
            cxx: g++-14
            apt: g++-14
          - name: Linux x86-64 (GCC 15)
            runner: ubuntu-26.04
            shell: bash
            cc: gcc-15
            cxx: g++-15
            apt: g++-15
          - name: Linux x86-64 (Clang 21)
            runner: ubuntu-26.04
            shell: bash
            cc: clang-21
            cxx: clang++-21
            apt: clang-21 libomp-21-dev

          # Linux, AArch64. Free for public repositories; billed for private ones.
          - name: Linux AArch64 (GCC 14)
            runner: ubuntu-26.04-arm
            shell: bash
            cc: gcc-14
            cxx: g++-14
            apt: g++-14
          - name: Linux AArch64 (Clang 21)
            runner: ubuntu-26.04-arm
            shell: bash
            cc: clang-21
            cxx: clang++-21
            apt: clang-21 libomp-21-dev

          # macOS, Apple Silicon only: Intel Macs are not supported.
          - name: macOS AArch64 (Apple Clang)
            runner: macos-latest
            shell: bash
            cc: clang
            cxx: clang++
            use_iokit: true

          # Windows, x86-64. MSVC is not supported: the Windows code uses winpthreads
          # (`pthread_gethandle`), so the build goes through MSYS2’s MinGW-w64 toolchain.
          - name: Windows x86-64 (MinGW GCC)
            runner: windows-2025
            shell: "msys2 {0}"
            msystem: UCRT64
            cc: gcc
            cxx: g++
            pacboy: gcc:p meson:p ninja:p pkgconf:p

    steps:
      - uses: actions/checkout@v4

      - name: Install MSYS2 toolchain
        if: matrix.msystem != ''
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          pacboy: ${{ matrix.pacboy }}

      - name: Install Linux toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ninja-build python3-pip ${{ matrix.apt }}
          pip install --break-system-packages --upgrade meson

      - name: Install macOS toolchain
        if: runner.os == 'macOS'
        run: brew install meson ninja libomp

      # Every dependency is a pinned tarball wrap, so this cache covers all of them.
      - name: Cache Meson subprojects
        uses: actions/cache@v4
        with:
          path: subprojects/packagecache
          key: packagecache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('subprojects/*.wrap') }}

      - name: Report versions
        run: |
          meson --version
          ninja --version
          ${{ matrix.cxx }} --version

      # `--wrap-mode=forcefallback` builds every dependency from the wraps in `subprojects/`,
      # so no system packages are needed.
      - name: Configure (debug)
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: >-
          meson setup build-debug
          -Dbuild_tests=true
          -Duse_iokit=${{ matrix.use_iokit || 'false' }}
          --wrap-mode=forcefallback
          --warnlevel 3
          --buildtype=debug

      - name: Build and test (debug)
        run: |
          meson compile -C build-debug
          meson test -C build-debug --print-errorlogs

      - name: Configure (optimized)
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: >-
          meson setup build-opt
          -Dbuild_tests=true
          -Duse_iokit=${{ matrix.use_iokit || 'false' }}
          --wrap-mode=forcefallback
          --warnlevel 1
          --optimization=3
          -Db_ndebug=true

      - name: Build and test (optimized)
        run: |
          meson compile -C build-opt
          meson test -C build-opt --print-errorlogs

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: meson-logs-${{ matrix.name }}
          path: |
            build-debug/meson-logs/
            build-opt/meson-logs/
          if-no-files-found: ignore

  #-------------------------------------------------------------------------------------------------
  # CMake, the alternative build system: one entry per platform, to catch it drifting from Meson
  #-------------------------------------------------------------------------------------------------
  cmake:
    name: CMake · ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86-64 (GCC 14)
            runner: ubuntu-26.04
            shell: bash
            cc: gcc-14
            cxx: g++-14
            apt: g++-14
          - name: Linux x86-64 (Clang 21)
            runner: ubuntu-26.04
            shell: bash
            cc: clang-21
            cxx: clang++-21
            apt: clang-21 libomp-21-dev
          - name: Linux AArch64 (GCC 14)
            runner: ubuntu-26.04-arm
            shell: bash
            cc: gcc-14
            cxx: g++-14
            apt: g++-14
          - name: macOS AArch64 (Apple Clang)
            runner: macos-latest
            shell: bash
            cc: clang
            cxx: clang++
            use_iokit: "ON"
          - name: Windows x86-64 (MinGW GCC)
            runner: windows-2025
            shell: "msys2 {0}"
            msystem: UCRT64
            cc: gcc
            cxx: g++
            pacboy: gcc:p cmake:p ninja:p pkgconf:p

    steps:
      - uses: actions/checkout@v4

      - name: Install MSYS2 toolchain
        if: matrix.msystem != ''
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          pacboy: ${{ matrix.pacboy }}
          install: git

      - name: Install Linux toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y cmake git ninja-build ${{ matrix.apt }}

      - name: Install macOS toolchain
        if: runner.os == 'macOS'
        run: brew install cmake ninja libomp

      - name: Report versions
        run: |
          cmake --version
          ${{ matrix.cxx }} --version

      # CMake fetches its dependencies with FetchContent, pinned to the same versions as the Meson
      # wraps; caching the download directory keeps that off the network on repeat runs.
      - name: Cache CMake dependencies
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.fetchcontent
          key: fetchcontent-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure, build and test (Debug)
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake -S . -B build-cmake-debug -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DTHESAUROS_BUILD_TESTS=ON \
            -DTHESAUROS_USE_IOKIT=${{ matrix.use_iokit || 'OFF' }} \
            -DFETCHCONTENT_BASE_DIR=${{ github.workspace }}/.fetchcontent
          cmake --build build-cmake-debug
          ctest --test-dir build-cmake-debug --output-on-failure

      - name: Configure, build and test (Release)
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake -S . -B build-cmake-release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DTHESAUROS_BUILD_TESTS=ON \
            -DTHESAUROS_USE_IOKIT=${{ matrix.use_iokit || 'OFF' }} \
            -DFETCHCONTENT_BASE_DIR=${{ github.workspace }}/.fetchcontent
          cmake --build build-cmake-release
          ctest --test-dir build-cmake-release --output-on-failure
